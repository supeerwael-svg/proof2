name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Install Capacitor Core, CLI and Android
      run: npm install @capacitor/cli @capacitor/core @capacitor/android

    - name: Create Capacitor Config if missing
      run: |
        if [ ! -f capacitor.config.json ]; then
          echo '{
            "appId": "com.teacherportfolio.app",
            "appName": "محفظة الأستاذ",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json
        fi

    - name: Build Web App
      run: npm run build

    - name: Add Capacitor Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Fix Kotlin Stdlib Version Conflict
      run: |
        echo "
        subprojects {
            configurations.all {
                resolutionStrategy {
                    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                }
            }
        }
        " >> android/build.gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: .

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android
